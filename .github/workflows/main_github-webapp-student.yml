
name: Deploy HTML App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C8074CD58D084BE383793FF2E6FEB556 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_08C9D0CBC33B46F6BD1159AAEBC7BD6C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2AC4A40F124C40454A8D3CB8FC94489C }}

      - name: Deploy HTML to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: github-webapp-student
          package: .
